[package]
name = "libc-sys"
description = "Raw FFI bindings to glibc, generated from the host's headers"
links = "c"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# C doc comments carry C code blocks that are not Rust doctests.
doctest = false

[build-dependencies]
# Pinned exactly: the committed bindings are its output.
bindgen = { workspace = true, optional = true }
cc.workspace = true

[features]
# Regenerates the bindings from the host's headers, in place of the shipped ones.
bindgen = ["dep:bindgen"]
