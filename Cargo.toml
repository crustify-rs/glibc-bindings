[package]
name = "glibc-bindings"
description = "Safe Rust wrappers over glibc's C API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["libc"]
libc = ["dep:libc-sys"]

[dependencies]
ffibox.workspace = true
libc-sys = { workspace = true, optional = true }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "libc-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/crustify-rs/glibc-bindings"
license = "LGPL-2.1-or-later"
publish = false

[workspace.dependencies]
bindgen = { version = "0.73", features = ["experimental"] }
ffibox = { path = "/opt/venv/share/ffibox" }
trybuild = "1"
libc-sys = { path = "libc-sys" }

[workspace.metadata.crustify]
nightly = "nightly-2026-10-08"

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
module_inception = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
